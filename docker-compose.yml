services:
  api:
    platform: linux/amd64
    image: vcr.vercel.com/its-nandlals-projects/aayeshol/aayeshol-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: aayeshol-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - aayeshol_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http = require('http'); const req = http.get('http://127.0.0.1:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

networks:
  aayeshol_network:
    driver: bridge
