name: Docker Build & Push

on:
  workflow_run:
    workflows: ['CI — Validation']
    branches: [main, v2]
    types:
      - completed
  push:
    branches: [main, v2]
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  docker:
    name: Build & Push API Image
    # Run only if triggered by workflow_dispatch, direct push, or successful CI workflow_run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/aayeshol-api:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/aayeshol-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
