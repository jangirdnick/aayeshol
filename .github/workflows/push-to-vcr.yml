name: Push to VCR

on:
  workflow_run:
    workflows: ['CI — Validation']
    branches: [main, v2]
    types:
      - completed
  push:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  push:
    name: Build & Push VCR Image
    # Run only if triggered by direct push or successful CI workflow_run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to VCR
        uses: docker/login-action@v3
        with:
          registry: registry.vercel.com
          username: oci
          password: ${{ secrets.VERCEL_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          tags: ${{ vars.VERCEL_IMAGE_TAG }}
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
