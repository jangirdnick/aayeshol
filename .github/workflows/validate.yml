name: Validate — Format · Lint · Types · Test · Build · Audit

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '11.25.0'
  NODE_VERSION: '24'

jobs:
  ci:
    name: CI — Lint · Types · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ──────────────────────────────────────────────
      # 2. Setup pnpm (must come before Node setup
      #    so the cache path is resolved correctly)
      # ──────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # ──────────────────────────────────────────────
      # 3. Setup Node.js with pnpm store cache
      # ──────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # ──────────────────────────────────────────────
      # 4. Install dependencies (frozen lockfile)
      #    Ensures CI uses exactly the same versions
      #    as committed in pnpm-lock.yaml.
      # ──────────────────────────────────────────────
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # ──────────────────────────────────────────────
      # 5. Generate Prisma Client (api)
      #    MUST run before type-check, test, and build.
      #    The generated client is output to:
      #      apps/api/generated/prisma/
      #    which is git-ignored. No real DB connection
      #    is needed — prisma generate is a codegen step.
      # ──────────────────────────────────────────────
      - name: Generate Prisma Client
        shell: bash
        working-directory: apps/api
        run: pnpm exec prisma generate

      # ──────────────────────────────────────────────
      # 6. Format check (entire monorepo)
      #    Uses Prettier via root package script.
      # ──────────────────────────────────────────────
      - name: Format check
        shell: bash
        run: pnpm format:check

      # ──────────────────────────────────────────────
      # 7. Lint (all workspaces — via Turborepo)
      #    api  → oxlint (src/ + test/)
      #    web  → eslint --max-warnings 0
      # ──────────────────────────────────────────────
      - name: Lint
        shell: bash
        run: pnpm lint

      # ──────────────────────────────────────────────
      # 8. Type check (all workspaces — via Turborepo)
      #    api  → tsc --noEmit
      #    web  → next typegen && tsc --noEmit
      # ──────────────────────────────────────────────
      - name: Type check
        shell: bash
        run: pnpm check-types

      # ──────────────────────────────────────────────
      # 9. Unit tests — api only (vitest)
      #    Runs *.spec.ts files (app.controller.spec.ts)
      #    These are isolated unit tests — no real Redis,
      #    DB, or external services are required.
      #
      #    E2E tests (*.e2e-spec.ts) are intentionally
      #    excluded: they bootstrap AppModule which
      #    requires live Redis + env vars unavailable in CI.
      #    E2E tests should run in a dedicated environment
      #    with service containers (future pipeline).
      #
      #    web has no tests defined yet.
      # ──────────────────────────────────────────────
      - name: Unit tests (api)
        shell: bash
        run: pnpm --filter api test

      # ──────────────────────────────────────────────
      # 10. Build (all workspaces — via Turborepo)
      #     api  → nest build  (outputs to apps/api/dist/)
      #     web  → next build  (outputs to apps/web/.next/)
      #     Turborepo resolves build order automatically.
      # ──────────────────────────────────────────────
      - name: Build (api + web)
        shell: bash
        run: pnpm build

      # ──────────────────────────────────────────────
      # 11. Security audit (high + critical severity)
      #     The unfixable braces CVE (GHSA-vfj7-8cjw-p6xm)
      #     is suppressed via auditConfig.ignoreGhsas
      #     in pnpm-workspace.yaml — no extra flags needed.
      # ──────────────────────────────────────────────
      - name: Security audit
        shell: bash
        run: pnpm audit --audit-level=high
