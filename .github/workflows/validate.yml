name: CI — Validation

on:
  pull_request:
    branches:
      - main
      - v2
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.vscode/**'
      - '.idea/**'
      - '.agents/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '11.25.0'
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  ci:
    name: Validate Monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout (shallow is faster and free)
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # 2. Setup pnpm package manager
      # ──────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # ──────────────────────────────────────────────
      # 3. Setup Node.js with pnpm store caching
      # ──────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # ──────────────────────────────────────────────
      # 4. Turborepo Cache (Accelerates build & lint)
      # ──────────────────────────────────────────────
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # ──────────────────────────────────────────────
      # 5. Install dependencies (frozen lockfile)
      # ──────────────────────────────────────────────
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # ──────────────────────────────────────────────
      # 6. Generate Prisma Client (Codegen for backend)
      # ──────────────────────────────────────────────
      - name: Generate Prisma Client
        shell: bash
        working-directory: apps/api
        run: pnpm exec prisma generate

      # ──────────────────────────────────────────────
      # 7. Fast Prettier formatting check
      # ──────────────────────────────────────────────
      - name: Format check
        shell: bash
        run: pnpm format:check

      # ──────────────────────────────────────────────
      # 8. Lint (oxlint for api + eslint for web)
      # ──────────────────────────────────────────────
      - name: Lint
        shell: bash
        run: pnpm lint

      # ──────────────────────────────────────────────
      # 9. Strict Type check
      # ──────────────────────────────────────────────
      - name: Type check
        shell: bash
        run: pnpm check-types

      # ──────────────────────────────────────────────
      # 10. Unit tests (api vitest)
      # ──────────────────────────────────────────────
      - name: Unit tests (api)
        shell: bash
        run: pnpm --filter api test

      # ──────────────────────────────────────────────
      # 11. Production Build (Turborepo parallel build)
      # ──────────────────────────────────────────────
      - name: Build (api + web)
        shell: bash
        run: pnpm build

      # ──────────────────────────────────────────────
      # 12. Security audit (high & critical severity)
      # ──────────────────────────────────────────────
      - name: Security audit
        shell: bash
        run: pnpm audit --audit-level=high
