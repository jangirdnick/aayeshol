version: 2
updates:
  # GitHub Actions Workflow Dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'ci/cd'

  # Root Monorepo Workspace (pnpm)
  # Note: GitHub Dependabot uses 'npm' as the official package-ecosystem identifier for npm, yarn, and pnpm.
  # Dependabot automatically detects pnpm via the root pnpm-lock.yaml & pnpm-workspace.yaml.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'root'
    groups:
      dev-tooling:
        patterns:
          - '@types/*'
          - 'prettier'
          - 'turbo'
          - 'typescript'
          - 'vitest'

  # Backend Application (apps/api)
  - package-ecosystem: 'npm'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'api'
    groups:
      nestjs-ecosystem:
        patterns:
          - '@nestjs/*'
      prisma-orm:
        patterns:
          - '@prisma/*'
          - 'prisma'

  # Frontend Application (apps/web)
  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'web'
    groups:
      react-next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react*'

  # Shared Types Package (packages/types)
  - package-ecosystem: 'npm'
    directory: '/packages/types'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'types'
